<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="German Waste Collection Schedule Processor"
    />
    <title>Abfuhrkalender</title>

    <!-- Tailwind CSS (built) -->
    <link rel="stylesheet" href="./assets/css/output.css" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <!-- ============================================ -->
    <!-- Header -->
    <!-- ============================================ -->
    <header class="bg-white border-b border-slate-200">
      <div
        class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between"
      >
        <div>
          <h1 class="text-2xl font-bold text-slate-900" data-i18n="app.title">
            Abfuhrkalender
          </h1>
          <p class="text-sm text-slate-600" data-i18n="app.subtitle">
            Ihr persönlicher Abfallkalender
          </p>
        </div>

        <!-- Language Switch -->
        <div class="flex items-center gap-2">
          <button
            id="lang-de"
            class="px-3 py-1 text-sm rounded-md bg-emerald-600 text-white font-medium"
          >
            DE
          </button>
          <button
            id="lang-en"
            class="px-3 py-1 text-sm rounded-md bg-slate-200 text-slate-700 font-medium hover:bg-slate-300"
          >
            EN
          </button>
        </div>
      </div>
    </header>

    <!-- ============================================ -->
    <!-- Main Content -->
    <!-- ============================================ -->
    <main class="max-w-6xl mx-auto px-4 py-8">
      <!-- Phase 0: Basic Placeholder -->
      <div
        class="bg-white rounded-lg shadow-sm border border-slate-200 p-8 text-center"
      >
        <div
          class="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 rounded-full mb-4"
        >
          <svg
            class="w-8 h-8 text-emerald-600"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </div>
        <h2 class="text-xl font-semibold text-slate-900 mb-2">
          Phase 0: Frontend Skeleton
        </h2>
        <p class="text-slate-600 mb-4">
          Frontend skeleton ready. Full UI coming in Phase 1.
        </p>
        <p class="text-sm text-slate-500" id="api-status">
          Checking API connection...
        </p>
      </div>
    </main>

    <!-- ============================================ -->
    <!-- Footer -->
    <!-- ============================================ -->
    <footer class="mt-12 border-t border-slate-200 bg-white">
      <div
        class="max-w-6xl mx-auto px-4 py-6 text-center text-sm text-slate-500"
      >
        <p>© 2026 Developed by Mirza Zain</p>
      </div>
    </footer>

    <!-- ============================================ -->
    <!-- Scripts -->
    <!-- ============================================ -->
    <script type="module">
      import { initI18n, setLanguage } from "./assets/js/i18n.js";
      import { healthCheck } from "./assets/js/api.js";

      // Initialize i18n
      await initI18n();

      // Language switch buttons
      document.getElementById("lang-de").addEventListener("click", async () => {
        await setLanguage("de");
        updateLanguageButtons("de");
      });

      document.getElementById("lang-en").addEventListener("click", async () => {
        await setLanguage("en");
        updateLanguageButtons("en");
      });

      function updateLanguageButtons(active) {
        const deBtn = document.getElementById("lang-de");
        const enBtn = document.getElementById("lang-en");

        if (active === "de") {
          deBtn.className =
            "px-3 py-1 text-sm rounded-md bg-emerald-600 text-white font-medium";
          enBtn.className =
            "px-3 py-1 text-sm rounded-md bg-slate-200 text-slate-700 font-medium hover:bg-slate-300";
        } else {
          deBtn.className =
            "px-3 py-1 text-sm rounded-md bg-slate-200 text-slate-700 font-medium hover:bg-slate-300";
          enBtn.className =
            "px-3 py-1 text-sm rounded-md bg-emerald-600 text-white font-medium";
        }
      }

      // Check API connection
      try {
        const health = await healthCheck();
        document.getElementById("api-status").innerHTML =
          `<span class="text-emerald-600">✓ API connected (v${health.version})</span>`;
      } catch (error) {
        document.getElementById("api-status").innerHTML =
          `<span class="text-red-600">✗ API not reachable</span>`;
      }
    </script>
  </body>
</html>
